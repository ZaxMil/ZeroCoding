name: Temporary bundle import
on:
  push:
    branches:
      - bundle/migrate-agent-skill-bundle
permissions:
  contents: write
jobs:
  import-bundle:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: bundle/migrate-agent-skill-bundle
          fetch-depth: 0
      - name: Import reviewed bundle snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/bundle-src agent-skill-bundle
          mkdir -p /tmp/bundle-src agent-skill-bundle
          curl -fsSL "https://github.com/ZAX-MILLION/agent-skill-bundle/archive/61eed7c9bcab917372a372e0fb8566d4a4471b56.tar.gz" -o /tmp/bundle.tgz
          tar -xzf /tmp/bundle.tgz -C /tmp/bundle-src --strip-components=1
          cp -a /tmp/bundle-src/. agent-skill-bundle/
          rm -f agent-skill-bundle/install-agent-init.sh agent-skill-bundle/install-agent-init.ps1
          rm -f .github/workflows/bundle-import.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Agent Skill Bundle into Coding"
          git push origin HEAD:bundle/migrate-agent-skill-bundle
