name: Agent Skill Bundle CI
on:
  pull_request:
    paths:
      - "agent-skill-bundle/**"
      - ".github/workflows/agent-bundle-ci.yml"
  push:
    branches:
      - main
    paths:
      - "agent-skill-bundle/**"
      - ".github/workflows/agent-bundle-ci.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-skill-bundle
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Syntax
        run: |
          python3 -m py_compile scripts/bundle_manager.py scripts/agent_init.py scripts/skill_doctor.py scripts/optional_packs.py scripts/smart_skill_router.py
          bash -n install/bootstrap.sh tests/bundle-installation.sh tests/agent-project-bootstrap.sh
      - name: Optional pack registry and offline safety tests
        run: |
          python3 scripts/optional_packs.py verify-manifest
          python3 scripts/optional_packs.py list
          python3 scripts/optional_packs.py status
          python3 -m unittest discover -s tests -p 'test_optional_packs.py'

      - name: Per-request routing without loading full skill bodies
        run: |
          python3 -m unittest discover -s tests -p 'test_smart_skill_router.py'
          python3 scripts/smart_skill_router.py --task "Redesign my website UI and animation" --json
          python3 scripts/smart_skill_router.py --task "Audit web security and SEO indexing" --json
          python3 scripts/smart_skill_router.py --task "Hi" --json

      - name: Real pinned upstream checkout smoke test
        run: |
          python3 scripts/optional_packs.py install --pack emil --cache "$RUNNER_TEMP/zerocoding-external-packs"
          python3 scripts/optional_packs.py status --pack emil --cache "$RUNNER_TEMP/zerocoding-external-packs"
          python3 scripts/optional_packs.py remove --pack emil --cache "$RUNNER_TEMP/zerocoding-external-packs"

      - name: Legacy repository references
        run: |
          if grep -RInE --exclude-dir=.git "ZAX-MILLION/(agent-skill-bundle|Coding)" .; then
            echo "Legacy repository reference found."
            exit 1
          fi
      - name: Public content gate
        run: python3 scripts/public_repo_gate.py .
      - name: Source boundaries
        run: python3 tests/verify-source-boundaries.py
      - name: Machine and project bootstrap
        run: |
          bash tests/bundle-installation.sh
          bash tests/agent-project-bootstrap.sh
      - name: Full and on-demand install regression
        run: bash tests/on-demand-install.sh
