 <text x="912" y="173" font-size="12" fill="#83A9AC" letter-spacing="1.4" font-weight="700">YOUR IDEA</text>
 <text x="912" y="195" font-size="19" font-weight="700" fill="#F2FAFF">"Build something incredible."</text>
 <path d="M1092 227v17m-7-7 7 7 7-7" stroke="#71E9C9" stroke-width="2.5" fill="none" stroke-linecap="round"/>
