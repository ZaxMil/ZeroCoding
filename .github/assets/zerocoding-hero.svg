 <rect x="266" y="463" width="240" height="36" rx="10" fill="#1E2540" stroke="#667395" stroke-opacity=".5"/>
 <text x="287" y="486" fill="#DCE5FF" font-size="14" letter-spacing=".7" font-weight="700">BUILT FOR AI AGENTS</text>
 <rect x="817" y="62" width="554" height="438" rx="24" fill="#040810" opacity=".65" filter="url(#soft)"/>
 <rect x="815" y="58" width="554" height="438" rx="24" fill="url(#panel)" stroke="url(#edge)" stroke-width="2"/>
 <path d="M815 113H1369" stroke="#7E92B7" stroke-opacity=".25"/>
 <circle cx="845" cy="86" r="6" fill="#FE7E94"/><circle cx="867" cy="86" r="6" fill="#F8CC79"/><circle cx="889" cy="86" r="6" fill="#8CF0C1"/>
 <text x="1093" y="92" text-anchor="middle" font-size="15" fill="#91A4C8" letter-spacing="1.5">ZEROCODING / WORKSPACE</text>
 <rect x="843" y="143" width="498" height="75" rx="13" fill="#111E2D" stroke="#4F7381" stroke-opacity=".6"/>
 <rect x="860" y="162" width="37" height="37" rx="11" fill="#234A45"/>
