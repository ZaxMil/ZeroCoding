<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
<title id="title">ZeroCoding — Turn your ideas into things that work</title>
<desc id="desc">Dark editorial-style cover with electric mint and violet accents. An idea becomes a guided AI workflow in a stylized workspace window.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070C18"/><stop offset=".54" stop-color="#0D1324"/><stop offset="1" stop-color="#11102B"/></linearGradient>
 <linearGradient id="brand" x1="0" y1="0" x2="1" y2=".2"><stop stop-color="#B7FF81"/><stop offset=".5" stop-color="#5DFFD0"/><stop offset="1" stop-color="#71BFFF"/></linearGradient>
 <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#181F33"/><stop offset="1" stop-color="#0D1527"/></linearGradient>
 <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8DFBD7" stop-opacity=".65"/><stop offset="1" stop-color="#8A7FFF" stop-opacity=".16"/></linearGradient>
 <radialGradient id="glowA"><stop stop-color="#55F3BC" stop-opacity=".23"/><stop offset="1" stop-color="#55F3BC" stop-opacity="0"/></radialGradient>
 <radialGradient id="glowB"><stop stop-color="#7D65FA" stop-opacity=".24"/><stop offset="1" stop-color="#7D65FA" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#9EA7D0" stroke-opacity=".075"/></pattern>
 <filter id="soft"><feGaussianBlur stdDeviation="28"/></filter>
</defs>
<rect width="1440" height="560" rx="24" fill="url(#bg)"/>
<rect width="1440" height="560" rx="24" fill="url(#grid)"/>
<ellipse cx="1190" cy="98" rx="420" ry="345" fill="url(#glowB)"/>
<ellipse cx="585" cy="590" rx="520" ry="270" fill="url(#glowA)"/>
<path d="M0 522h1440" stroke="#A0ACC6" stroke-opacity=".13"/>
<rect x="1" y="1" width="1438" height="558" rx="23" fill="none" stroke="#A9B1D4" stroke-opacity=".23" stroke-width="2"/>
<g font-family="Arial, Helvetica, sans-serif">
 <rect x="68" y="58" width="215" height="34" rx="17" fill="#172B2C" stroke="#3D8E7E" stroke-opacity=".8"/>
 <circle cx="89" cy="75" r="5" fill="#BAFF83"/>
 <text x="104" y="81" font-size="14" letter-spacing="2" fill="#C9FFDD" font-weight="700">THE AI SKILLS VAULT</text>
 <text x="66" y="224" font-size="115" font-weight="900" letter-spacing="-7" fill="#F6F9FF">ZERO</text>
 <text x="66" y="337" font-size="115" font-weight="900" letter-spacing="-7" fill="url(#brand)">CODING<tspan fill="#F5F7FF">.</tspan></text>
 <text x="73" y="395" font-size="25" fill="#E2EAF9" font-weight="600">Big ideas don't need to start with code.</text>
 <text x="73" y="432" font-size="21" fill="#96A7C4">Give your AI the right skills to build, fix and ship.</text>
 <rect x="72" y="463" width="183" height="36" rx="10" fill="#A9FCB0"/>
 <text x="90" y="486" fill="#091924" font-size="14" font-weight="800" letter-spacing=".5">205 SKILLS</text>
