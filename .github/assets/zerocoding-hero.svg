 <path d="m865 345 5 5 8-10" stroke="#CAFFE5" fill="none" stroke-width="2" stroke-linecap="round"/>
 <text x="896" y="350" font-size="16" fill="#DFEAF7">Find the matching workflow</text>
 <circle cx="871" cy="378" r="11" fill="#3D356C"/>
 <path d="m867 378 3 4 7-8" stroke="#C8B7FF" fill="none" stroke-width="2" stroke-linecap="round"/>
 <text x="896" y="383" font-size="16" fill="#DFEAF7">Build, test, improve</text>
 <rect x="843" y="429" width="498" height="44" rx="11" fill="#17372F" stroke="#4A9C7F" stroke-opacity=".65"/>
 <circle cx="869" cy="451" r="5" fill="#A7FF95"/>
 <text x="886" y="457" font-size="15" fill="#C4FFE1" font-weight="700" letter-spacing=".4">FROM IDEA TO REAL PROGRESS</text>
 <text x="74" y="541" font-size="12" fill="#7084A5" letter-spacing="2.2">LESS PROMPTING. MORE BUILDING.</text>
 <text x="1361" y="541" text-anchor="end" font-size="12" fill="#7084A5" letter-spacing="1.7">OPEN WORKFLOWS / ZAXMIL</text>
