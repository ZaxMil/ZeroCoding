<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="335" viewBox="0 0 1400 335" role="img" aria-labelledby="title desc">
<title id="title">ZeroCoding in three steps: describe, discover, deliver</title>
<desc id="desc">First describe the project, then your AI discovers a suitable skill, finally build and verify with the tools available to your AI agent.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0B1020"/><stop offset="1" stop-color="#17142C"/></linearGradient><linearGradient id="line"><stop stop-color="#A8FCAB"/><stop offset="1" stop-color="#6EBAFF"/></linearGradient></defs>
<rect width="1400" height="335" rx="20" fill="url(#bg)"/>
<rect x="1" y="1" width="1398" height="333" rx="19" fill="none" stroke="#677699" stroke-opacity=".32" stroke-width="2"/>
<g font-family="Arial, Helvetica, sans-serif">
 <text x="48" y="56" font-size="27" font-weight="800" fill="#F3F7FF">One simple idea. A more capable AI workflow.</text>
 <text x="49" y="83" font-size="16" fill="#95A7C7">You stay in control. ZeroCoding helps your agent choose what to use next.</text>
 <g>
 <rect x="47" y="110" width="408" height="174" rx="16" fill="#17223A" stroke="#4E617C"/>
 <rect x="67" y="130" width="48" height="36" rx="10" fill="#2C5549"/><text x="91" y="154" font-size="18" font-weight="800" fill="#C3FFBF" text-anchor="middle">01</text>
 <text x="131" y="156" font-size="21" font-weight="800" fill="#F6F7FE">Describe it</text>
 <text x="69" y="199" font-size="17" fill="#D4DFF0">"Make my website faster."</text>
 <text x="69" y="233" font-size="15" fill="#98AFD0">Start with your goal, not syntax.</text>
 <rect x="496" y="110" width="408" height="174" rx="16" fill="#17223A" stroke="#5E5D91"/>
 <rect x="516" y="130" width="48" height="36" rx="10" fill="#3F366D"/><text x="540" y="154" font-size="18" font-weight="800" fill="#DDD0FF" text-anchor="middle">02</text>
 <text x="581" y="156" font-size="21" font-weight="800" fill="#F6F7FE">Find the right skill</text>
 <text x="518" y="199" font-size="17" fill="#D4DFF0">Targeted guidance, on demand.</text>
 <text x="518" y="233" font-size="15" fill="#98AFD0">No need to load the whole vault.</text>
 <rect x="945" y="110" width="408" height="174" rx="16" fill="#17223A" stroke="#437D7B"/>
 <rect x="965" y="130" width="48" height="36" rx="10" fill="#285D57"/><text x="989" y="154" font-size="18" font-weight="800" fill="#AEFFE8" text-anchor="middle">03</text>
 <text x="1030" y="156" font-size="21" font-weight="800" fill="#F6F7FE">Build and verify</text>
 <text x="967" y="199" font-size="17" fill="#D4DFF0">Your agent follows a workflow.</text>
 <text x="967" y="233" font-size="15" fill="#98AFD0">Review real outputs and test results.</text>
 </g>
 <path d="M462 196h25m-8-7 8 7-8 7M911 196h25m-8-7 8 7-8 7" fill="none" stroke="url(#line)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
 <text x="48" y="314" font-size="13" fill="#768AAE">SETUP IS EXPLICIT. NO CODE CHANGES OR DEPLOYMENTS HAPPEN JUST BY INSTALLING THE BUNDLE.</text>
</g></svg>